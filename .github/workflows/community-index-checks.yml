name: BC ONE community index tests

on:
  push:
    paths:
      - 'token_index/**'
      - '.github/workflows/community-index-checks.yml'
  pull_request:
    paths:
      - 'token_index/**'
      - '.github/workflows/community-index-checks.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test community index
        run: python -m unittest discover -s token_index -v
      - name: Compile module
        run: python -m py_compile token_index/community_index.py
