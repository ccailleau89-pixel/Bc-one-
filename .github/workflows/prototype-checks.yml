name: BC ONE prototype checks

on:
  pull_request:
    paths:
      - "prototype/**"
      - "supabase/**"
      - "package.json"
      - "vite.config.js"
      - ".env.example"
      - ".github/workflows/prototype-checks.yml"
  push:
    branches:
      - "feature/bc-one-erc20-contract-2026-10"
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-checks.yml"

permissions:
  contents: read

jobs:
  static-checks:
    name: Validate offline demo interface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build bundled frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check prototype structure and safety notices
        run: python prototype/check_prototype.py
