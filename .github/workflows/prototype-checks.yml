name: Prototype checks

on:
  push:
    branches:
      - main
      - "feature/app-prototype-2026-10"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static prototype checks
        run: node scripts/check-prototype.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node scripts/browser-smoke.mjs
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-one-prototype-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
