name: Burger Coin checks

on:
  push:
    paths:
      - "token/burger-coin/**"
      - ".github/workflows/burger-coin-checks.yml"
  pull_request:
    paths:
      - "token/burger-coin/**"
      - ".github/workflows/burger-coin-checks.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: token/burger-coin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: token/burger-coin/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run compile
